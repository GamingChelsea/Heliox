[package]
name = "rust-music-player"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
gpui-kit = { git = "https://github.com/gpui-ce/gpui-component", package = "gpui_ce_kit" }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev]
debug = 2
