[package]
name = "heliox"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
dirs = "7.0.0"
discord-presence = "3.2.0"
gpui-kit = { git = "https://github.com/gpui-ce/gpui-component", package = "gpui_ce_kit" }
lofty = "0.25.4"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["blocking", "stream"] }
rfd = "0.17.2"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
souvlaki = "0.8.3"
strum = { version = "0.28.0", features = ["derive"] }
symphonia = { version = "0.5.4", features = ["all"] }
symphonia-adapter-libopus = "0.2.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.dev]
debug = 2
