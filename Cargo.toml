[package]
name = "heliox"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
dirs = "7.0.0"
discord-presence = "3.2.0"
log = "0.4"
lofty = "0.25.4"
nsh-core = "0.5.0"
nsh-base = { version = "0.5.0", default-features = false }
raw-window-handle = "0.6.2"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["blocking", "stream", "json"] }
rfd = "0.17.2"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = "0.8.3"
strum = { version = "0.28.0", features = ["derive"] }
symphonia = { version = "0.5.4", features = ["all"] }
symphonia-adapter-libopus = "0.2.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false }

[profile.dev]
debug = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
